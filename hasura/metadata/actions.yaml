actions:
  - name: triggerWorkflowRun
    definition:
      kind: synchronous
      handler: "{{APP_URL}}/api/actions/trigger-workflow-run"
      forward_client_headers: true
      headers:
        - name: x-action-secret
          value_from_env: ACTION_SECRET
    permissions:
      - role: user

  - name: approveStep
    definition:
      kind: synchronous
      handler: "{{APP_URL}}/api/actions/approve-step"
      forward_client_headers: true
      headers:
        - name: x-action-secret
          value_from_env: ACTION_SECRET
    permissions:
      - role: user

  - name: startWorkflowFromWebhook
    definition:
      kind: synchronous
      handler: "{{APP_URL}}/api/actions/webhook-start"
      headers:
        - name: x-action-secret
          value_from_env: ACTION_SECRET
    # No `permissions` block on purpose: this Action is called by external
    # systems hitting the REST->Action endpoint with a per-trigger secret
    # (checked inside the handler), not by logged-in org members.

custom_types:
  enums: []
  input_objects:
    - name: WorkflowRunInput
      fields:
        - name: workflow_id
          type: uuid!
    - name: ApproveStepInput
      fields:
        - name: step_run_id
          type: uuid!
    - name: WebhookStartInput
      fields:
        - name: workflow_id
          type: uuid!
        - name: secret
          type: String!
        - name: payload
          type: json
  objects:
    - name: TriggerRunOutput
      fields:
        - name: workflow_run_id
          type: uuid!
        - name: status
          type: String!
    - name: ApproveStepOutput
      fields:
        - name: step_run_id
          type: uuid!
        - name: status
          type: String!
  scalars: []
